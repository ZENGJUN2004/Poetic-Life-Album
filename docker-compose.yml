services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poetic-realm-app
    ports:
      - '80:3000'
    env_file:
      - .env
    volumes:
      - uploads:/app/public/uploads
      - db-data:/app/prisma
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production-please-set-a-real-secret}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode === 200 || r.statusCode === 307 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: ["node", "server.js"]

volumes:
  uploads:
  db-data:
